<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ER Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--pn:#fff;--ink:#1d2433;--mu:#6a7384;--ln:#d5dae3;--ac:#0f766e;--acs:#d6efec;--er:#b4233a;--wr:#a66300;--gr:#dfe4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141922;--pn:#1c2330;--ink:#e6e9f0;--mu:#97a0b2;--ln:#32394a;--ac:#3cc4b6;--acs:#1d3a3a;--er:#ff7b8f;--wr:#e7a94a;--gr:#262e3d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--acs);border-color:var(--ac)}button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}button.dg{color:var(--er)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 8px;width:100%}
#home{max-width:880px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;font-weight:800;margin:0 0 4px}.mu{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .t{flex:1;min-width:180px}.card b{font-weight:600;cursor:pointer}
#ed{display:none;height:100%;grid-template-rows:auto 1fr;}
#top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
#main{display:grid;grid-template-columns:150px 1fr 270px;min-height:0}
#tools,#side{background:var(--pn);overflow:auto;padding:8px}#tools{border-inline-end:1px solid var(--ln)}#side{border-inline-start:1px solid var(--ln)}
#tools button{display:block;width:100%;margin-bottom:4px;text-align:start}
#cv{width:100%;height:100%;display:block;background:var(--bg);touch-action:none;cursor:default}
.sh{fill:var(--pn);stroke:var(--ink);stroke-width:1.6}.tx{font:13px Vazirmatn,Tahoma,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ln{stroke:var(--ink);stroke-width:1.6;fill:none}.ln2{stroke:var(--pn);stroke-width:2.4;fill:none}.hit{stroke:transparent;stroke-width:12;fill:none}
.sel .sh{stroke:var(--ac);stroke-width:3}.lb{font:12px sans-serif;fill:var(--mu);text-anchor:middle}
.hd{fill:var(--ac);stroke:var(--pn);stroke-width:2;opacity:0;cursor:crosshair}g[data-n]:hover .hd,.sel .hd{opacity:1}.bL{font-weight:600}label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}
.msg{border-inline-start:3px solid var(--mu);padding:4px 8px;margin:4px 0;background:var(--bg);cursor:pointer;font-size:12px}.msg.e{border-color:var(--er)}.msg.w{border-color:var(--wr)}
#dlg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}#dlg>div{background:var(--pn);padding:18px;border-radius:10px;width:min(380px,92vw)}
@media(max-width:760px){#main{grid-template-columns:100px 1fr}#side{position:fixed;bottom:0;inset-inline:0;max-height:42%;border-top:1px solid var(--ln)}}
</style>
</head>
<body>
<div id="home">
  <h1>ER Studio</h1>
  <div class="mu">طراحی نمودار ER و EER با نمادگذاری Chen. همهٔ پروژه‌ها فقط در همین مرورگر ذخیره می‌شوند؛ از پروژه‌های مهم خروجی بگیرید.</div>
  <div class="bar">
    <button class="pr" id="bNew">پروژهٔ جدید</button><button id="bSample">پروژهٔ نمونه</button>
    <button id="bImp">وارد کردن فایل</button><button id="bAll">پشتیبان از همه</button><button class="bL">EN</button>
    <input id="q" placeholder="جست‌وجو" style="width:160px"><select id="so" style="width:140px"><option value="u">آخرین ویرایش</option><option value="n">نام</option></select>
  </div>
  <div id="list"></div>
</div>
<div id="ed">
  <div id="top">
    <button id="bBack">پروژه‌ها</button><b id="pn"></b><span class="mu" id="st"></span>
    <span style="flex:1"></span>
    <button id="bUn">واگرد</button><button id="bRe">ازنو</button><button id="bVal">اعتبارسنجی</button><button id="bFit">نمایش همه</button>
    <button id="bGrid">شبکه</button><button class="bL">EN</button><button id="bExj">JSON</button><button id="bExs">SVG</button><button id="bImp2">Import</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <svg id="cv"><g id="vp"></g></svg>
    <div id="side"></div>
  </div>
</div>
<div id="dlg"><div id="dlgc"></div></div>
<input type="file" id="fi" accept=".json" hidden>
<script>
const T={entity:'موجودیت قوی',weak:'موجودیت ضعیف',rel:'رابطه',idrel:'رابطه شناسایی',attr:'صفت',key:'صفت شناسه',pkey:'کلید جزئی',multi:'چندمقداری',derived:'مشتق',isa:'IS-A (EER)',note:'یادداشت'};
const ATT=['attr','key','pkey','multi','derived'],ENT=['entity','weak'],REL=['rel','idrel'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'i'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
let lang=(()=>{try{return localStorage.getItem('erl')||'fa'}catch{return'fa'}})();let P=null,sel=null,tool='sel',pend=null,V={x:0,y:0,k:1},grid=false,hist=[],fut=[],tmr=null,drag=null;
/* ---------- storage ---------- */
let db;const dbo=()=>db||(db=new Promise((res,rej)=>{const r=indexedDB.open('erstudio',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
async function tx(m,f){const d=await dbo();return new Promise((res,rej)=>{const t=d.transaction('p',m),s=t.objectStore('p'),r=f(s);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})}
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=p=>tx('readwrite',s=>s.put(p)),dbDel=id=>tx('readwrite',s=>s.delete(id));
function stat(t){$('#st').textContent=t}
function save(){stat('در حال ذخیره…');clearTimeout(tmr);tmr=setTimeout(flush,350)}
async function flush(){if(!P)return;try{P.updated=Date.now();await dbPut(P);stat('ذخیره شد')}catch(e){stat('ذخیره ناموفق بود')}}
addEventListener('beforeunload',()=>{if(P)dbPut(P)});
/* ---------- model ---------- */
const nn=(p,t,name,x,y,o={})=>{const n={id:uid(),type:t,name,x,y,...o};p.nodes.push(n);return n};
const ee=(p,a,b,o={})=>{const e={id:uid(),a:a.id,b:b.id,total:false,card:'',role:'',...o};p.edges.push(e);return e};
function newP(name,type,desc){return{id:uid(),schemaVersion:1,name,type,desc:desc||'',created:Date.now(),updated:Date.now(),nodes:[],edges:[]}}
function sample(){const p=newP('نمونه: ثبت‌نام دانشجو','ER','');const s=nn(p,'entity','Student',120,200),c=nn(p,'entity','Course',520,200),r=nn(p,'rel','Enrolls',320,200);
ee(p,s,r,{total:true,card:'M'});ee(p,r,c,{card:'N'});
const a=nn(p,'key','StudentID',60,80),b=nn(p,'attr','Name',200,80),d=nn(p,'key','CourseID',480,80),g=nn(p,'attr','Semester',320,320);
ee(p,s,a);ee(p,s,b);ee(p,c,d);ee(p,r,g);return p}
const nb=(p,id)=>p.edges.filter(e=>e.a===id||e.b===id).map(e=>[e,p.nodes.find(n=>n.id===(e.a===id?e.b:e.a))]);
/* ---------- home ---------- */
async function home(){P=null;$('#ed').style.display='none';$('#home').style.display='block';let l=await dbAll();const q=$('#q').value.trim().toLowerCase();
l=l.filter(p=>p.name.toLowerCase().includes(q));l.sort($('#so').value==='n'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.updated-a.updated);
$('#list').innerHTML=l.length?l.map(p=>`<div class="card"><div class="t"><b data-o="${p.id}">${esc(p.name)}</b> <span class="mu">(${p.type})</span><div class="mu">${p.nodes.filter(n=>ENT.includes(n.type)).length} موجودیت · ${p.nodes.filter(n=>REL.includes(n.type)).length} رابطه · ${p.nodes.length} عنصر · ${new Date(p.updated).toLocaleString(lang==='fa'?'fa-IR':'en-GB')}</div></div><button data-o="${p.id}" class="pr">باز کردن</button><button data-r="${p.id}">تغییر نام</button><button data-d="${p.id}">تکثیر</button><button data-x="${p.id}">خروجی</button><button class="dg" data-z="${p.id}">حذف</button></div>`).join(''):'<div class="mu">هنوز پروژه‌ای ندارید. با «پروژهٔ جدید» شروع کنید.</div>'}
$('#list').onclick=async e=>{const t=e.target,g=k=>t.dataset[k];const all=await dbAll(),f=id=>all.find(p=>p.id===id);
if(g('o'))open(f(g('o')));else if(g('r')){const p=f(g('r')),v=prompt('نام جدید',p.name);if(v?.trim()){p.name=v.trim();p.updated=Date.now();await dbPut(p);home()}}
else if(g('d')){const p=clone(f(g('d')),true);p.name+=' (کپی)';await dbPut(p);home()}
else if(g('x'))dl(f(g('x')).name+'.er.json',JSON.stringify({schemaVersion:1,project:f(g('x'))},null,1));
else if(g('z')){const p=f(g('z'));dlg(`<b>حذف «${esc(p.name)}»؟</b><p class="mu">این پروژه برای همیشه از این مرورگر حذف می‌شود. پروژه‌های دیگر تغییر نمی‌کنند.</p><button class="dg" id="ok">حذف کن</button> <button id="no">انصراف</button>`,async()=>{await dbDel(p.id);home()})}}
$('#q').oninput=home;$('#so').onchange=home;
function clone(p,fresh){const c=JSON.parse(JSON.stringify(p));if(fresh){const m={};c.id=uid();c.created=c.updated=Date.now();c.nodes.forEach(n=>{const o=n.id;n.id=uid();m[o]=n.id});c.edges.forEach(e=>{e.id=uid();e.a=m[e.a];e.b=m[e.b]})}return c}
function dlg(h,ok){$('#dlgc').innerHTML=h;$('#dlg').style.display='flex';const c=()=>$('#dlg').style.display='none';$('#no')&&($('#no').onclick=c);$('#ok')&&($('#ok').onclick=()=>{c();ok&&ok()})}
$('#bNew').onclick=()=>dlg(`<b>پروژهٔ جدید</b><label>نام</label><input id="fn" value="پروژهٔ جدید"><label>توضیحات (اختیاری)</label><input id="fd"><label>نوع</label><select id="ft"><option>ER</option><option>EER</option></select><p class="mu">ER برای نمودار پایه است؛ EER ابزار IS-A را هم فعال می‌کند.</p><button class="pr" id="ok">ایجاد</button> <button id="no">انصراف</button>`,()=>{const p=newP($('#fn').value.trim()||'بدون نام',$('#ft').value,$('#fd').value);dbPut(p).then(()=>open(p))});
$('#bSample').onclick=async()=>{const p=sample();await dbPut(p);open(p)};
$('#bAll').onclick=async()=>dl('er-backup.json',JSON.stringify({schemaVersion:1,projects:await dbAll()}));
$('#bImp').onclick=$('#bImp2').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch{return alert('فایل JSON معتبر نیست.')}
if(typeof d.schemaVersion!=='number')return alert('فایل نسخهٔ Schema ندارد.');if(d.schemaVersion>1)return alert('این فایل با نسخهٔ جدیدتری ساخته شده و قابل وارد کردن نیست.');
const L=d.projects||(d.project?[d.project]:null);if(!L)return alert('پروژه‌ای در فایل پیدا نشد.');
for(const p of L){if(!Array.isArray(p.nodes)||!Array.isArray(p.edges))return alert('ساختار پروژه خراب است.');const ids=new Set(p.nodes.map(n=>n.id));if(p.edges.some(x=>!ids.has(x.a)||!ids.has(x.b)))return alert('فایل ارجاع شکسته دارد (اتصال به عنصر ناموجود).')}
dlg(`<b>وارد کردن ${L.length} پروژه</b><div class="mu">${L.map(p=>esc(p.name)+' ('+p.nodes.length+' عنصر)').join('<br>')}</div><p>پروژه‌ها با شناسهٔ جدید و به‌صورت پروژهٔ تازه اضافه می‌شوند و داده‌های فعلی بازنویسی نمی‌شوند.</p><button class="pr" id="ok">وارد کن</button> <button id="no">انصراف</button>`,async()=>{for(const p of L){const c=clone(p,true);c.name+=' (واردشده)';await dbPut(c)}P?await home():home()})};
function dl(n,t,m='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
/* ---------- editor ---------- */
function open(p){P=p;sel=null;tool='sel';pend=null;hist=[];fut=[];$('#home').style.display='none';$('#ed').style.display='grid';$('#pn').textContent=p.name+' ('+p.type+')';stat('ذخیره شد');tools();fit();draw()}
$('#bBack').onclick=async()=>{await flush();home()};
function tools(){const L=Object.keys(T).filter(k=>k!=='isa'||P.type==='EER');$('#tools').innerHTML=`<button data-t="sel" class="${tool==='sel'?'on':''}">انتخاب / جابه‌جایی</button><button data-t="link" class="${tool==='link'?'on':''}">اتصال دو عنصر</button><hr>`+L.map(k=>`<button data-t="${k}" class="${tool===k?'on':''}">+ ${T[k]}</button>`).join('')+`<hr><button id="bDel" class="dg">حذف انتخاب</button>`}
$('#tools').onclick=e=>{const t=e.target.dataset.t;if(t){tool=t;pend=null;tools();hint()}if(e.target.id==='bDel')del()};
function hint(){stat(tool==='link'?'عنصر اول را انتخاب کنید، سپس عنصر دوم':tool!=='sel'?'روی بوم کلیک کنید تا «'+T[tool]+'» اضافه شود':'')}
function snap(){hist.push(JSON.stringify({n:P.nodes,e:P.edges}));if(hist.length>100)hist.shift();fut=[]}
function restore(s){const o=JSON.parse(s);P.nodes=o.n;P.edges=o.e;sel=null;draw();save()}
$('#bUn').onclick=undo;$('#bRe').onclick=redo;
function undo(){if(!hist.length)return;fut.push(JSON.stringify({n:P.nodes,e:P.edges}));restore(hist.pop())}
function redo(){if(!fut.length)return;hist.push(JSON.stringify({n:P.nodes,e:P.edges}));restore(fut.pop())}
const dim=n=>{const l=(n.name||'').length;if(ATT.includes(n.type))return[Math.max(76,l*8+34),40];if(REL.includes(n.type))return[Math.max(96,l*9+56),64];if(n.type==='isa')return[36,36];return[Math.max(96,l*9+34),46]};
function clip(n,dx,dy){const[w,h]=dim(n),a=w/2,b=h/2;if(!dx&&!dy)return 0;let t;if(ENT.includes(n.type)||n.type==='note')t=Math.min(a/Math.abs(dx||1e-9),b/Math.abs(dy||1e-9));else if(REL.includes(n.type))t=1/(Math.abs(dx)/a+Math.abs(dy)/b);else t=1/Math.sqrt((dx/a)**2+(dy/b)**2);return t}
function shape(n){const[w,h]=dim(n),a=w/2,b=h/2,t=n.type;let s='';
if(ENT.includes(t))s=`<rect class="sh" x="${-a}" y="${-b}" width="${w}" height="${h}"/>`+(t==='weak'?`<rect class="sh" style="fill:none" x="${-a+5}" y="${-b+5}" width="${w-10}" height="${h-10}"/>`:'');
else if(REL.includes(t))s=`<polygon class="sh" points="0,${-b} ${a},0 0,${b} ${-a},0"/>`+(t==='idrel'?`<polygon class="sh" style="fill:none" points="0,${-b+7} ${a-11},0 0,${b-7} ${-a+11},0"/>`:'');
else if(t==='isa')return`<circle class="sh" r="18"/><text class="tx" style="font-size:12px">${n.dis==='o'?'o':'d'}</text>`;
else if(t==='note')return`<rect class="sh" style="stroke-dasharray:4 3;fill:none" x="${-a}" y="${-b}" width="${w}" height="${h}"/><text class="tx">${esc(n.name)}</text>`;
else s=`<ellipse class="sh" ${t==='derived'?'style="stroke-dasharray:5 3"':''} rx="${a}" ry="${b}"/>`+(t==='multi'?`<ellipse class="sh" style="fill:none" rx="${a-5}" ry="${b-5}"/>`:'');
const ul=t==='key'?'underline':t==='pkey'?'underline dashed':'none';return s+`<text class="tx" style="text-decoration:${ul}">${esc(n.name)}</text>`}
function draw(){const m=new Map(P.nodes.map(n=>[n.id,n])),cnt={};let h='';
P.edges.forEach(e=>{const A=m.get(e.a),B=m.get(e.b);if(!A||!B)return;const k=[e.a,e.b].sort().join(),i=cnt[k]=(cnt[k]||0)+1,tot=P.edges.filter(x=>[x.a,x.b].sort().join()===k).length,off=(i-(tot+1)/2)*14;
let dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy)||1,px=-dy/L*off,py=dx/L*off;
const ta=clip(A,dx,dy),tb=clip(B,-dx,-dy),x1=A.x+dx*ta+px,y1=A.y+dy*ta+py,x2=B.x-dx*tb+px,y2=B.y-dy*tb+py,d=`M${x1} ${y1}L${x2} ${y2}`;
const isaTot=(A.type==='isa'||B.type==='isa')&&e.role==='super'&&(A.cover||B.cover)==='total';
const dbl=e.total||isaTot,c=e.id===sel?' style="stroke:var(--ac)"':'';
h+=`<g data-e="${e.id}"><path class="hit" d="${d}"/><path class="ln"${c} d="${d}" ${dbl?'stroke-width="5"':''}/>${dbl?`<path class="ln2" d="${d}"/>`:''}`;
const ent=ENT.includes(B.type)||B.type==='attr'?B:A,oth=ent===B?A:B,lt=ent===B?.78:.22,lx=x1+(x2-x1)*lt+(py?py*.5:0),ly=y1+(y2-y1)*lt-8;
const lab=[e.card,e.role].filter(Boolean).join(' · ');if(lab)h+=`<text class="lb" x="${lx}" y="${ly}">${esc(lab)}</text>`;h+='</g>'});
P.nodes.forEach(n=>{const[w,hh]=dim(n),a=w/2,b=hh/2;h+=`<g data-n="${n.id}" class="${n.id===sel||n.id===pend?'sel':''}" transform="translate(${n.x} ${n.y})" style="cursor:move">${shape(n)}${[[a,0],[-a,0],[0,-b],[0,b]].map(([x,y])=>`<circle class="hd" data-h="1" cx="${x}" cy="${y}" r="6"/>`).join('')}</g>`});if(drag&&drag.t==='c'){const A=m.get(drag.from);h+=`<path class="ln" style="stroke:var(--ac);stroke-dasharray:5 4;pointer-events:none" d="M${A.x} ${A.y}L${drag.x} ${drag.y}"/>`}
let g='';if(grid){const s=40*V.k;g=''}
$('#vp').setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.k})`);$('#vp').innerHTML=h;$('#cv').style.backgroundImage=grid?`radial-gradient(var(--gr) 1.2px,transparent 1.2px)`:'none';$('#cv').style.backgroundSize=`${20*V.k}px ${20*V.k}px`;$('#cv').style.backgroundPosition=`${V.x}px ${V.y}px`;
panel()}
const cp=ev=>{const r=$('#cv').getBoundingClientRect();return{x:(ev.clientX-r.left-V.x)/V.k,y:(ev.clientY-r.top-V.y)/V.k}};
const sn=v=>grid?Math.round(v/20)*20:v;
$('#cv').onpointerdown=ev=>{const gn=ev.target.closest('[data-n]'),ge=ev.target.closest('[data-e]'),p=cp(ev);
if(tool==='link'){if(gn){const id=gn.dataset.n;if(!pend)pend=id;else{snap();ee(P,P.nodes.find(n=>n.id===pend),P.nodes.find(n=>n.id===id));pend=null;sel=P.edges.at(-1).id;save()}draw()}return}
if(tool!=='sel'){snap();const base=tool==='isa'?{cover:'partial',dis:'d'}:{};const n=nn(P,tool,tr(T[tool].replace(' (EER)','')),sn(p.x),sn(p.y),{...base,dt:'',nullable:true,desc:''});sel=n.id;tool='sel';tools();stat('');save();draw();return}
if(gn&&ev.target.closest('[data-h]')){sel=gn.dataset.n;drag={t:'c',from:sel,x:p.x,y:p.y};draw()}else if(gn){sel=gn.dataset.n;const n=P.nodes.find(n=>n.id===sel);drag={t:'n',ox:p.x-n.x,oy:p.y-n.y,s:false};draw()}
else if(ge){sel=ge.dataset.e;draw()}else{sel=null;drag={t:'p',sx:ev.clientX-V.x,sy:ev.clientY-V.y};draw()}

function tr(s){if(lang==='fa')return s;const t=s.trim();if(M.has(t))return s.replace(t,M.get(t));if(t.startsWith('+ ')&&M.has(t.slice(2)))return s.replace(t.slice(2),M.get(t.slice(2)));for(const[a,b]of F)s=s.split(a).join(b);return s}
let busy=0;function apply(){busy=0;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())L.push(n);for(const n of L){const p=n.parentNode.tagName;if(p==='SCRIPT'||p==='STYLE')continue;if(n.__o===undefined)n.__o=n.nodeValue;const v=tr(n.__o);if(n.nodeValue!==v)n.nodeValue=v}document.querySelectorAll('[placeholder]').forEach(e=>{e.dataset.o=e.dataset.o||e.placeholder;e.placeholder=tr(e.dataset.o)})}
new MutationObserver(()=>{if(!busy){busy=1;requestAnimationFrame(apply)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
